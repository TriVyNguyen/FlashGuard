spring.application.name=flashguard
server.port=${PORT:8080}

# ===== MySQL =====
# Đổi qua biến môi trường DB_URL / DB_USERNAME / DB_PASSWORD, hoặc sửa trực tiếp ở đây.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/flashguard?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# READ_COMMITTED: sau khi một UPDATE có điều kiện trả về 0 dòng, lần đọc lại
# trong cùng transaction sẽ thấy trạng thái mới nhất (không bị "ảnh chụp" cũ của REPEATABLE READ).
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.datasource.hikari.maximum-pool-size=20

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ===== Nghiệp vụ =====
# Thời gian giữ hàng của một đơn chưa thanh toán (giây)
app.order.hold-seconds=300
# Chu kỳ quét đơn hết hạn (ms)
app.order.expire-scan-ms=2000

# ===== Swagger =====
springdoc.swagger-ui.path=/swagger-ui.html
